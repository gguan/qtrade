name: Build main branch documentation website

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  docs:
    name: Generate Website
    runs-on: ubuntu-latest
    env:
      SPHINX_GITHUB_CHANGELOG_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r docs/requirements.txt
          pip install .

      - name: Build English documentation
        run: |
          sphinx-build -W --keep-going -b html \
            -D language=en \
            docs docs/_build/html_combined/en

      - name: Build Chinese documentation
        run: |
          sphinx-build -W --keep-going -b html \
            -D language=zh_CN \
            docs docs/_build/html_combined/zh

      - name: Add root-level redirect to English
        run: |
          cat > docs/_build/html_combined/index.html <<'HTML'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=en/">
            <link rel="canonical" href="en/">
            <title>QTrade documentation</title>
          </head>
          <body>
            <p>Redirecting to <a href="en/">English documentation</a>… (<a href="zh/">中文</a>)</p>
          </body>
          </html>
          HTML

      - name: Remove .doctrees
        run: |
          rm -rf docs/_build/html_combined/en/.doctrees
          rm -rf docs/_build/html_combined/zh/.doctrees

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html_combined
