[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qtrade-lib"
version = "0.6.0"
description = "A Python library for backtesting trading strategies and applying reinforcement learning to trading."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guan Guan", email = "guanguan1114@gmail.com" }]
keywords = ["trading", "backtesting", "reinforcement learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "bokeh>=3.9",
    "tqdm>=4.66",
    "gymnasium>=1.0",
    "mplfinance>=0.12.10b0",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.0",
]
data = [
    "yfinance>=0.2.40",
]
cn = [
    "akshare>=1.13",
]
dev = [
    "pytest>=8.0.0",
    "pytest-benchmark>=4.0",
    "coverage>=7.0.0",
    "ruff",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/gguan/qtrade"
Repository = "https://github.com/gguan/qtrade"

[tool.hatch.build.targets.wheel]
packages = ["qtrade"]

[tool.ruff]
line-length = 127
target-version = "py310"

[tool.ruff.lint]
# See https://beta.ruff.rs/docs/rules/
select = ["E", "F", "B", "UP", "C90", "RUF"]
# B028: Ignore explicit stacklevel
# RUF013: Too many false positives (implicit optional)
# RUF002/RUF003: false positives on full-width punctuation in Chinese comments/docstrings
ignore = ["B028", "RUF013", "F821", "B027", "RUF012", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests: ClassVar / implicit-optional not relevant; long-line allowed for descriptive assertions
"tests/*.py" = ["RUF012", "RUF013", "E501"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmarks are slow (multi-second) and platform-dependent; opt in by
# running `pytest tests/benchmarks/` explicitly.
addopts = "--ignore=tests/benchmarks"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true  # Many ecosystem libs (bokeh, mplfinance, etc.) lack type stubs
files = ["qtrade"]

# Per-module relaxations: these files have known typing debt around Trade's
# Optional[float] properties (profit, exit_price, exit_date) being used as
# non-Optional after a trade closes. Tracked as future work.
[[tool.mypy.overrides]]
module = [
    "qtrade.utils.evaluation",
    "qtrade.utils.plot_bokeh",
    "qtrade.utils.heatmap",
    "qtrade.utils.report",
    "qtrade.core.broker",
]
ignore_errors = true

[tool.coverage.run]
disable_warnings = ["couldnt-parse"]
branch = false
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError()",
    "if typing.TYPE_CHECKING:",
]
